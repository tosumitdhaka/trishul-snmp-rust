[package]
name = "trishul-snmp"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Async SNMP toolkit: manager, notifications, read-only responder, MIB enrichment"
repository = "https://github.com/tosumitdhaka/trishul-snmp-rust"
readme = "README.md"
keywords = ["snmp", "network", "monitoring", "mib", "usm"]
categories = ["network-programming", "asynchronous"]
# tests/, fixtures/, and docs/ ship in the package so downstream `cargo test`
# works (fixtures are read via CARGO_MANIFEST_DIR); repo-only tooling is
# excluded.
exclude = [
    ".cortexkit/",
    ".github/",
    "benchmarks/",
    "crates/",
    "fixtures/wire-golden/generate.py",
    "fixtures/3des-datagram/generate.py",
]

[[bin]]
name = "tsnmp"
path = "src/bin/tsnmp.rs"

# Env-gated conformance suite lives under tests/conformance/; cargo only
# auto-discovers top-level tests/*.rs, so it is registered explicitly.
[[test]]
name = "conformance_snmpd"
path = "tests/conformance/snmpd.rs"

[dependencies]
rasn = "=0.28.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cfb-mode = "0.8"
des = "0.8"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
clap = { version = "4.6", features = ["derive", "env"] }

[dev-dependencies]
proptest = "1"