# tsnmp-r conformance-gate snmpd agent.
#
# Single-process merge of the Python reference's live-agent configs:
#   * main agent   (127.0.0.1:1161 + v3 on :1162)  — from .github/workflows/quality.yml
#   * restricted VACM view agent (:1173)           — from tests/test_snmpd_integration.py
#   * v3-only agent (:1174)                        — from tests/test_snmpd_integration.py
#   * coldStart notification agent (:1171)          — notification fixture directives
#
# Launch:  snmpd -C -f -c snmpd.conf -p snmpd.pid -Lf snmpd.log
# See SOURCE.md for every adaptation made while merging.

# ── main agent: v1/v2c + the SNMPv3 crypto matrix ────────────────────────────
rocommunity public 127.0.0.1
agentaddress 127.0.0.1:1161,127.0.0.1:1162,127.0.0.1:1171,127.0.0.1:1173,127.0.0.1:1174
engineID reederinvest
createUser -e 0x80001f8804726565646572696e76657374 tsnmpuser SHA-256 "authpassword12345" AES-256 "privpassword12345"
rouser tsnmpuser
createUser -e 0x80001f8804726565646572696e76657374 user224 SHA-224 "authpassword12345" AES-256 "privpassword12345"
rouser user224
createUser -e 0x80001f8804726565646572696e76657374 user384 SHA-384 "authpassword12345" AES-192 "privpassword12345"
rouser user384
createUser -e 0x80001f8804726565646572696e76657374 user512 SHA-512 "authpassword12345" AES-256 "privpassword12345"
rouser user512
createUser -e 0x80001f8804726565646572696e76657374 userSha256Aes192 SHA-256 "authpassword12345" AES-192 "privpassword12345"
rouser userSha256Aes192

# ── coldStart notifications (v1 trap + v2c trap + inform) ────────────────────
# ADAPTATION: the reference fixture sinks into the ephemeral port of a
# pytest-bound listener; here the sink is pinned to 127.0.0.1:1170 — bind a
# listener there before starting this agent to capture the one-shot
# startup coldStart notifications.
trapsink 127.0.0.1:1170 public
trap2sink 127.0.0.1:1170 public
informsink 127.0.0.1:1170 public

# ── restricted VACM view (system subtree only) ────────────────────────────────
# ADAPTATION: original com2sec community was "public", which would clash with
# the main agent's rocommunity in a single process (first com2sec match wins,
# silently granting full access); renamed to "restricted". The view, groups
# and access rule are byte-identical to the reference.
view restricted included 1.3.6.1.2.1.1
com2sec restsec 127.0.0.1 restricted
group restgroup v1 restsec
group restgroup v2c restsec
group restgroup usm v3view
access restgroup "" any noauth exact restricted none none
# ADAPTATION: original createUser pinned -e 0x80001f8804726573747269637465645641434d
# (engineID "restrictedVACM"); re-pinned to this process's engineID. Passphrases
# and protocols are unchanged, so passphrase-based clients localize against the
# discovered engine exactly as before.
createUser -e 0x80001f8804726565646572696e76657374 v3view SHA-256 "authpassword12345" AES-128 "privpassword12345"

# ── v3-only user ──────────────────────────────────────────────────────────────
# ADAPTATION: the reference's dedicated :1174 agent had no community config at
# all (community requests were silently dropped). In this shared process,
# :1174 also answers the main agent's community "public" — the drop property
# itself is not reproducible in a single-process config. The v3only user and
# its credentials are preserved (engine re-pinned from
# 0x80001f880476336f6e6c79656e67696e65, engineID "v3onlyengine").
createUser -e 0x80001f8804726565646572696e76657374 v3only SHA-256 "authpassword12345" AES-128 "privpassword12345"
rouser v3only
